# Lint, tests and n8n's community-node scan on every push and pull request; release.yml calls it
# before publishing.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test # builds with n8n-node, then unit tests (no network)
      - name: The package contains only dist, README, LICENSE and CHANGELOG
        run: |
          files="$(npm pack --dry-run --json --ignore-scripts | jq -r '.[0].files[].path')"
          echo "$files"
          unexpected="$(grep -vE '^(dist/.+|package\.json|README\.md|LICENSE|CHANGELOG\.md)$' <<<"$files" || true)"
          [ -z "$unexpected" ] || { echo "::error::unexpected files in the npm package: $unexpected"; exit 1; }
      - run: node -e "JSON.parse(require('fs').readFileSync('examples/quote-request.json', 'utf8'))"

  scan:
    name: n8n community-node scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: Pack and unpack the tarball
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/pkg"
          tar -xzf "$RUNNER_TEMP"/n8n-nodes-honk-*.tgz -C "$RUNNER_TEMP/pkg" --strip-components=1
      - run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/scan" @n8n/scan-community-package
      - run: node scripts/scan.mjs "$RUNNER_TEMP/scan" "$RUNNER_TEMP/pkg"
