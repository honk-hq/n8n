# Lint, tests and n8n's community-node scan on every push and pull request; release.yml calls it
# before publishing.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test # builds with n8n-node, then unit tests (no network)
      - name: The package contains only dist, README, LICENSE and CHANGELOG
        run: |
          files="$(npm pack --dry-run --json --ignore-scripts | jq -r '.[0].files[].path')"
          echo "$files"
          unexpected="$(grep -vE '^(dist/.+|package\.json|README\.md|LICENSE|CHANGELOG\.md)$' <<<"$files" || true)"
          [ -z "$unexpected" ] || { echo "::error::unexpected files in the npm package: $unexpected"; exit 1; }
      - run: node -e "JSON.parse(require('fs').readFileSync('examples/quote-request.json', 'utf8'))"

  scan:
    name: n8n community-node scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      # n8n's own scanner, the static analysis it runs before verifying a community node: a local
      # scan lints the sources and the files `npm pack` would publish (npm provenance and the
      # attested source are checked only after publishing). Pinned: 0.44 replaced the internal
      # module scripts/scan.mjs imported.
      - run: npx --yes @n8n/scan-community-package@0.44.0 .
